<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bridge | Interactive Digital Rights Helpline</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Bridge 🌉</h1>
            <p>Interactive Legal & Digital Safety Assistant</p>
        </header>

        <div class="ussd-banner">
            📱 No Internet? Dial <strong>*384*123#</strong> on any phone to access this helpline via USSD!
        </div>

        <!-- Interactive Question Box -->
        <main>
            <div class="chat-card">
                <h2>Ask for Help</h2>
                <p>Describe your issue (e.g., mobile money scam, online threats, privacy violation):</p>
                
                <textarea id="user-input" placeholder="e.g., Someone is threatening to share my private messages online. What legal steps should I take?"></textarea>
                <button id="send-btn">Get Legal Assistance</button>
            </div>

            <div id="response-box" class="response-card hidden">
                <h3>Recommended Action Steps</h3>
                <div id="ai-reply"></div>
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
